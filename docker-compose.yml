# docker-compose.yml
services:
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 100 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    image: todo_app-backend:offline  # استفاده از image ساخته شده
    container_name: django-todoapp
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: unless-stopped


  smpt4dev:
    image: docker.arvancloud.ir/rnwood/smtp4dev
    restart: always 
    ports:
    # web panel
      - '5000:80'
    # smpt
      - '25:25'
    # imap
      - '143:143'
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__HostName=smtp4dev
    

volumes:
  redis_data:
  smtp4dev-data:

